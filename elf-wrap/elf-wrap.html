<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Elf Wrap LED Wall</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; transform-origin: 0 0; }
</style>
</head>
<body>
<canvas id="c" width="3840" height="1080"></canvas>
<audio id="au" src="elf-wrap-soundtrack.wav" preload="auto"></audio>
<script>
// =====================================================================
//  Bridgeway Chapel — "Elf Wrap" for the LED wall (3840 x 1080)
//  Safe (lit) areas, everything else stays black:
//    left  L: 0-864 x 0-384  +  0-192 x 384-864
//    middle : 1056-2784 x 0-384
//    right L: 2976-3840 x 0-384  +  3648-3840 x 384-864
//  The black gaps between the screens are the elves' "dead space":
//  they come and go through them and lean ladders against the screen edges.
//  Deterministic: window.__render(t) draws the frame at time t (seconds).
//  Open without ?capture to watch it live (click to start, with sound).
// =====================================================================
const W = 3840, H = 1080, DURATION = 72;
const TAU = Math.PI * 2;
const BPM = 132, BEAT = 60 / BPM;
const M0 = 5.0;                     // music downbeat
const V2 = M0 + 64 * BEAT;          // verse 2 / lights power on
const V3 = V2 + 64 * BEAT;          // tag
const TAGBEAT = 0.6;
const FINAL = V3 + 6 * TAGBEAT;     // last note: final snap
const SNAP1 = 4.3;

const TOP = 384, LEGB = 864, LEGW = 192;
const cv = document.getElementById('c');
const c = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIn = p => p * p * p;
const eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eElastic = p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * TAU / 3) + 1;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry(1225);
const rr = (a, b) => a + (b - a) * R();
const pick = arr => arr[Math.floor(R() * arr.length)];
const beatPos = t => (t - M0) / BEAT;

const SFX = [];
const sfx = (t, type, a = 0, b = 0) => SFX.push([+t.toFixed(4), type, a, b]);

// ---------- safe areas ----------
const SAFE = new Path2D();
SAFE.rect(0, 0, 864, 384); SAFE.rect(0, 384, 192, 480);
SAFE.rect(1056, 0, 1728, 384);
SAFE.rect(2976, 0, 864, 384); SAFE.rect(3648, 384, 192, 480);
const POLYS = [
  [[0, 0], [864, 0], [864, 384], [192, 384], [192, 864], [0, 864]],
  [[1056, 0], [2784, 0], [2784, 384], [1056, 384]],
  [[2976, 0], [3840, 0], [3840, 864], [3648, 864], [3648, 384], [2976, 384]],
];
const polyPath = pts => { const p = new Path2D(); p.moveTo(...pts[0]); for (const q of pts.slice(1)) p.lineTo(...q); p.closePath(); return p; };
const floorAt = x => (x < LEGW || x > W - LEGW) ? LEGB : TOP;
// where an elf at x leaves the wall: through the nearest gap / outer edge
function exitFor(x, y) {
  if (x < LEGW && y > TOP - 1) return -90;
  if (x > W - LEGW && y > TOP - 1) return W + 90;
  if (x < 960) return x < LEGW ? -90 : 864 + 90;
  if (x > 2880) return x > W - LEGW ? W + 90 : 2976 - 90;
  return x < 1920 ? 1056 - 90 : 2784 + 90;
}

// ---------- offscreen art ----------
function off(w, h) { const o = document.createElement('canvas'); o.width = w; o.height = h; return o; }
function starPath(g, x, y, r1, r2, n = 5, rot = -Math.PI / 2) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = rot + i * Math.PI / n; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  g.closePath();
}
function paperTile() {
  const t = off(200, 200), g = t.getContext('2d');
  g.fillStyle = '#a3101c'; g.fillRect(0, 0, 200, 200);
  g.strokeStyle = 'rgba(242,201,104,.55)'; g.lineWidth = 3;
  g.beginPath();
  for (let k = -400; k <= 400; k += 100) { g.moveTo(k, 0); g.lineTo(k + 200, 200); g.moveTo(k, 200); g.lineTo(k + 200, 0); }
  g.stroke();
  for (let x = 0; x <= 200; x += 50) for (let y = 0; y <= 200; y += 50) {
    if ((x + y) % 100 !== 50) continue;
    if (x % 100 === 50) { g.fillStyle = '#f2c94c'; starPath(g, x, y, 15, 6.5); g.fill(); }
    else { g.fillStyle = '#fbf3e4'; g.beginPath(); g.arc(x, y, 5, 0, TAU); g.fill(); }
  }
  return t;
}
function candyTile() {
  const t = off(120, 120), g = t.getContext('2d');
  g.fillStyle = '#fbf6ee'; g.fillRect(0, 0, 120, 120);
  for (let k = -240; k <= 240; k += 60) {
    g.fillStyle = '#d0202e';
    g.beginPath(); g.moveTo(k, 0); g.lineTo(k + 26, 0); g.lineTo(k + 26 - 120, 120); g.lineTo(k - 120, 120); g.closePath(); g.fill();
    g.fillStyle = '#1f9a45';
    g.beginPath(); g.moveTo(k + 36, 0); g.lineTo(k + 42, 0); g.lineTo(k + 42 - 120, 120); g.lineTo(k + 36 - 120, 120); g.closePath(); g.fill();
  }
  return t;
}
// inner shadow + soft top light, so each screen reads as the side of a box
function shadeOver(g) {
  for (const pts of POLYS) {
    const pp = polyPath(pts);
    g.save(); g.clip(pp);
    const hole = new Path2D(); hole.rect(-2000, -2000, W + 4000, H + 4000); hole.addPath(pp);
    g.shadowColor = 'rgba(0,0,0,.75)'; g.shadowBlur = 46; g.fillStyle = '#000';
    g.fill(hole, 'evenodd');
    g.restore();
  }
  g.save(); g.clip(SAFE);
  const lg = g.createLinearGradient(0, 0, 0, LEGB);
  lg.addColorStop(0, 'rgba(255,255,255,.10)'); lg.addColorStop(.42, 'rgba(255,255,255,0)'); lg.addColorStop(1, 'rgba(0,0,0,.28)');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  g.restore();
}
const PAPER = off(W, H), CANDY = off(W, H);
{
  const g = PAPER.getContext('2d');
  g.save(); g.clip(SAFE); g.fillStyle = g.createPattern(paperTile(), 'repeat'); g.fillRect(0, 0, W, H); g.restore();
  shadeOver(g);
  const h = CANDY.getContext('2d');
  h.save(); h.beginPath(); h.rect(0, TOP, LEGW, LEGB - TOP); h.rect(W - LEGW, TOP, LEGW, LEGB - TOP); h.clip();
  h.fillStyle = h.createPattern(candyTile(), 'repeat'); h.fillRect(0, 0, W, H);
  const lg = h.createLinearGradient(0, 0, LEGW, 0);
  lg.addColorStop(0, 'rgba(0,0,0,.35)'); lg.addColorStop(.25, 'rgba(0,0,0,0)'); lg.addColorStop(.75, 'rgba(0,0,0,0)'); lg.addColorStop(1, 'rgba(0,0,0,.35)');
  h.fillStyle = lg; h.fillRect(0, 0, LEGW, H);
  h.translate(W - LEGW, 0); h.fillRect(0, 0, LEGW, H);
  h.restore();
}
const BULB_COLORS = ['#ff3646', '#2fe46e', '#ffcf3a', '#3aa8ff', '#ff8a2a', '#ff6ad5'];
const GLOW = {};
function glowSprite(col) {
  if (GLOW[col]) return GLOW[col];
  const o = off(128, 128), g = o.getContext('2d');
  const rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  rg.addColorStop(0, col); rg.addColorStop(.18, col + 'cc'); rg.addColorStop(.5, col + '33'); rg.addColorStop(1, col + '00');
  g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
  return (GLOW[col] = o);
}
BULB_COLORS.concat(['#fff1c4', '#ffffff']).forEach(glowSprite);

// ---------- elves ----------
const SKINS = ['#f6d0b1', '#eab48f', '#c98e6a', '#8d5a3b', '#f1c6a0', '#a8714d'];
const HAIRS = ['#5a3a22', '#2b1d14', '#c58a3a', '#8a4b23', '#1a1310'];
const TUNICS = ['#1f9a45', '#c8232f', '#16805c', '#2f7d32', '#b81d4a', '#1b7f3a'];
function elfLook(s, o = {}) {
  const tunic = o.tunic || pick(TUNICS);
  let hat = pick(['#d7262f', '#e23a3a', '#1f9a45', '#c8232f']);
  if (hat === tunic) hat = '#d7262f';
  return Object.assign({ s, tunic, hat, stripe: pick(['#d7262f', '#1f9a45']), skin: pick(SKINS), hair: pick(HAIRS),
    shoe: pick(['#3b2416', '#1b5e2a', '#7a1620']), collar: pick(['#f4efe6', '#f2c94c']), bell: R() < .5, hatDir: R() < .5 ? -1 : 1 }, o);
}
function drawElf(L, p) {
  const k = L.s / 100, turn = p.turn == null ? 1 : p.turn, sq = p.squash || 0;
  c.save();
  c.translate(p.x, p.y);
  if (p.rot) c.rotate(p.rot);
  c.scale(k * turn * (1 + sq * 0.6), k * (1 - sq));
  c.lineCap = 'round'; c.lineJoin = 'round';
  const look = p.look || 0;
  // legs
  for (const side of [-1, 1]) {
    const a = side < 0 ? (p.legL || 0) : (p.legR || 0);
    c.save(); c.translate(side * 6, -30); c.rotate(-side * a);
    c.fillStyle = '#fbf6ee'; c.fillRect(-3.6, 0, 7.2, 24);
    c.fillStyle = L.stripe; for (let i = 0; i < 4; i++) c.fillRect(-3.6, 1.5 + i * 6, 7.2, 3);
    c.fillStyle = L.shoe;
    c.beginPath(); c.ellipse(side * 3, 26, 8, 4.6, 0, 0, TAU); c.fill();
    c.strokeStyle = L.shoe; c.lineWidth = 3;
    c.beginPath(); c.moveTo(side * 9, 25); c.quadraticCurveTo(side * 16, 25, side * 14.5, 18.5); c.stroke();
    c.restore();
  }
  // tunic with zig-zag hem
  c.fillStyle = L.tunic;
  c.beginPath(); c.moveTo(-11, -61); c.lineTo(11, -61); c.lineTo(19, -30);
  for (let i = 0; i <= 6; i++) c.lineTo(19 - i * 38 / 6, i % 2 ? -23 : -30);
  c.closePath(); c.fill();
  c.fillStyle = 'rgba(0,0,0,.13)';
  c.beginPath(); c.moveTo(3, -61); c.lineTo(11, -61); c.lineTo(19, -30); c.lineTo(6, -26); c.closePath(); c.fill();
  c.fillStyle = '#2b1a0f'; c.fillRect(-16.5, -43, 33, 5.5);
  if (!p.back) { c.strokeStyle = '#f2c94c'; c.lineWidth = 1.8; c.strokeRect(-4, -43.6, 8, 6.7); }
  c.fillStyle = L.collar;
  c.beginPath(); c.moveTo(-13, -62);
  for (let i = 0; i <= 8; i++) c.lineTo(-13 + i * 3.25, i % 2 ? -55 : -62);
  c.closePath(); c.fill();
  // arms
  for (const side of [-1, 1]) {
    const a = side < 0 ? (p.armL ?? 0.25) : (p.armR ?? 0.25);
    c.save(); c.translate(side * 10, -57); c.rotate(-side * a);
    c.fillStyle = L.tunic; c.beginPath(); c.roundRect(-4, -2, 8, 21, 4); c.fill();
    c.fillStyle = '#f4efe6'; c.fillRect(-4.3, 15, 8.6, 4);
    c.fillStyle = L.skin; c.beginPath(); c.arc(0, 22.5, 4.6, 0, TAU); c.fill();
    c.restore();
  }
  // head
  c.fillStyle = L.skin;
  for (const side of [-1, 1]) { c.beginPath(); c.moveTo(side * 10, -75); c.lineTo(side * 22, -81); c.lineTo(side * 10, -66); c.closePath(); c.fill(); }
  c.beginPath(); c.arc(0, -71, 12.5, 0, TAU); c.fill();
  if (p.back) {
    c.fillStyle = L.hair; c.beginPath(); c.ellipse(0, -70, 12.8, 11.5, 0, 0, TAU); c.fill();
  } else {
    const fx = look * 2.6;
    c.fillStyle = 'rgba(235,85,85,.45)';
    c.beginPath(); c.arc(-7 + fx * .6, -66.5, 3, 0, TAU); c.fill();
    c.beginPath(); c.arc(7 + fx * .6, -66.5, 3, 0, TAU); c.fill();
    c.fillStyle = '#1b1410';
    if (p.blink) { c.fillRect(-6.5 + fx, -73, 4, 1.2); c.fillRect(2.5 + fx, -73, 4, 1.2); }
    else {
      c.beginPath(); c.ellipse(-4.5 + fx, -73, 1.8, 2.5, 0, 0, TAU); c.fill();
      c.beginPath(); c.ellipse(4.5 + fx, -73, 1.8, 2.5, 0, 0, TAU); c.fill();
    }
    c.fillStyle = 'rgba(170,70,55,.45)'; c.beginPath(); c.arc(fx * .9, -69.5, 2.1, 0, TAU); c.fill();
    const m = p.mouth || 'smile';
    if (m === 'open') { c.fillStyle = '#5a1712'; c.beginPath(); c.ellipse(fx * .8, -65.5, 3, 3.6, 0, 0, TAU); c.fill(); }
    else if (m === 'grin') {
      c.fillStyle = '#5a1712'; c.beginPath(); c.arc(fx * .8, -67.5, 5.2, 0, Math.PI); c.closePath(); c.fill();
      c.fillStyle = '#fff'; c.fillRect(fx * .8 - 3.6, -67.5, 7.2, 1.6);
    } else {
      c.strokeStyle = '#5a1712'; c.lineWidth = 1.6;
      c.beginPath(); c.arc(fx * .8, -68.5, 4.5, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
    }
  }
  // hat
  c.save(); c.scale(L.hatDir, 1);
  const flop = p.hatFlop || 0;
  c.fillStyle = L.hat;
  c.beginPath(); c.moveTo(-12.5, -82); c.bezierCurveTo(-11, -99, 0, -110, 19 + flop, -104 + Math.abs(flop) * .3);
  c.bezierCurveTo(8, -99, 11, -91, 12.5, -82); c.closePath(); c.fill();
  c.fillStyle = '#f7f3ea'; c.beginPath(); c.roundRect(-15, -86, 30, 8, 4); c.fill();
  c.fillStyle = L.bell ? '#f2c94c' : '#f7f3ea';
  c.beginPath(); c.arc(19 + flop, -104 + Math.abs(flop) * .3, 4.8, 0, TAU); c.fill();
  c.restore();
  c.restore();
}
function handPos(L, p, side) {
  const k = L.s / 100, turn = p.turn == null ? 1 : p.turn;
  const a = side < 0 ? (p.armL ?? 0.25) : (p.armR ?? 0.25), th = -side * a;
  return [p.x + (side * 10 - 22.5 * Math.sin(th)) * k * turn, p.y + (-57 + 22.5 * Math.cos(th)) * k];
}
function walkPose(x, y, phase, dir, amp = 1) {
  const s = Math.sin(phase);
  return { x, y: y - Math.abs(Math.cos(phase)) * 3 * amp, legL: Math.max(0, s) * .5 * amp, legR: Math.max(0, -s) * .5 * amp,
    armL: .3 - s * .35 * amp, armR: .3 + s * .35 * amp, look: dir, rot: dir * .06 * amp, mouth: 'smile' };
}
const ACTORS = [];   // {t0, t1, z, draw(t)}
const addActor = (t0, t1, z, draw) => ACTORS.push({ t0, t1, z, draw });

// falling-in elf: lands at (x, yLand), then either runs out or hands over to `after`
const G = 2600;
function rainElf(t0, x, size, yLand, after) {
  const L = elfLook(size);
  const y0 = -size * 0.2 - 20;
  const tl = t0 + Math.sqrt(2 * (yLand - y0) / G);
  const spin = rr(-1, 1) * 3.2, ph = rr(0, TAU), back = R() < .25;
  const stand = rr(.25, .7);
  sfx(tl, 'boing', size);
  let ex = exitFor(x, yLand), dir = Math.sign(ex - x), v = rr(520, 760), t1 = tl + stand + Math.abs(ex - x) / v;
  if (after) t1 = DURATION;
  addActor(t0, t1, 1, t => {
    let p;
    if (t < tl) {
      const dt = t - t0;
      p = { x, y: y0 + .5 * G * dt * dt, rot: spin * (tl - t), armL: 2.6 + .4 * Math.sin(t * 22 + ph), armR: 2.6 + .4 * Math.sin(t * 22 + ph + 2),
        legL: .35 * Math.sin(t * 16 + ph), legR: .35 * Math.sin(t * 16 + ph + 1.5), mouth: 'open', back, hatFlop: 4 * Math.sin(t * 9) };
    } else if (t < tl + stand || after) {
      const s = t - tl;
      p = { x, y: yLand, squash: .28 * Math.exp(-s * 12) * Math.cos(s * 28), armL: lerp(2.4, 1.3, clamp(s * 5)), armR: lerp(2.4, 1.3, clamp(s * 5)), mouth: 'grin' };
      if (after && s > .35) p = after(t, L);
    } else {
      const s = t - tl - stand;
      p = walkPose(x + dir * v * s, yLand, s * 19, dir, 1.3);
    }
    drawElf(L, p);
  });
  return L;
}

// ---------- hero elf ----------
const HX = 1920;
const HERO = elfLook(300, { tunic: '#1f9a45', hat: '#d7262f', stripe: '#d7262f', skin: '#f3c9a6', hair: '#7a4a26', shoe: '#3b2416', collar: '#f2c94c', bell: true, hatDir: 1 });
function heroPose(t) {
  if (t < 0.6) return null;
  if (t < 1.9) {   // fall, back to camera
    const p = prog(t, 0.6, 1.9);
    return { x: HX, y: lerp(-40, TOP, p * p), back: true, rot: .1 * Math.sin(t * 7), armL: 2.5 + .45 * Math.sin(t * 20), armR: 2.5 + .45 * Math.sin(t * 20 + 1.7),
      legL: .3 + .3 * Math.sin(t * 14), legR: .3 + .3 * Math.sin(t * 14 + 2), hatFlop: 5 * Math.sin(t * 10) };
  }
  if (t < 2.7) {   // land
    const s = t - 1.9;
    return { x: HX, y: TOP, back: true, squash: .3 * Math.exp(-s * 8) * Math.cos(s * 22), armL: lerp(1.6, .3, clamp(s * 3)), armR: lerp(1.6, .3, clamp(s * 3)) };
  }
  if (t < 3.2) {   // turn around with a little hop
    const p = prog(t, 2.7, 3.2);
    return { x: HX, y: TOP - Math.sin(Math.PI * p) * 28, back: p < .5, turn: Math.max(.04, Math.abs(Math.cos(Math.PI * p))), armL: .3, armR: .3, mouth: 'smile' };
  }
  if (t < 3.6) return { x: HX, y: TOP, armL: .3, armR: .3, mouth: 'grin', look: Math.sin((t - 3.2) * 12) * .3, blink: t > 3.4 && t < 3.47 };
  if (t < 4.9) {   // the snap
    const up = eOut(prog(t, 3.6, 4.0));
    const jerk = t > SNAP1 ? Math.exp(-(t - SNAP1) * 10) * .25 : 0;
    return { x: HX, y: TOP, armL: .55, armR: lerp(.3, 2.35, up) - jerk, mouth: t > SNAP1 ? 'grin' : 'smile', look: .2 };
  }
  if (t < 6.2) {   // admire the wrap, wave
    const w = t > 5.5 ? Math.sin((t - 5.5) * 14) : 0;
    return { x: HX, y: TOP, armL: .55, armR: t > 5.5 ? 2.5 + .35 * w : lerp(2.35, 1.2, prog(t, 4.9, 5.2)), mouth: 'grin', look: Math.sin(t * 2) * .7 };
  }
  if (t < 7.2) {   // hop off the stage, down through the floor
    if (t < 6.35) return { x: HX, y: TOP, squash: .18 * prog(t, 6.2, 6.35), armL: .4, armR: .4, mouth: 'grin' };
    const s = t - 6.35;
    return { x: HX, y: TOP - 520 * s + .5 * 3400 * s * s, armL: 2.8, armR: 2.8, legL: .3, legR: .3, mouth: 'open' };
  }
  // return for the finale
  const T0 = FINAL - 10.5, TL = T0 + .8;
  if (t < T0) return null;
  if (t < TL) { const p = prog(t, T0, TL); return { x: HX, y: lerp(-60, TOP, p * p), armL: 2.7, armR: 2.7, legL: .3, legR: .3, mouth: 'open', hatFlop: 5 * Math.sin(t * 10) }; }
  const s = t - TL;
  const b = beatPos(t), bob = Math.abs(Math.sin(Math.PI * b));
  if (t < FINAL - 1.0) {
    if (t < V3) return { x: HX, y: TOP - bob * 10, squash: .3 * Math.exp(-s * 8) * Math.cos(s * 22), armL: 2.4 + .4 * Math.sin(Math.PI * b), armR: 2.4 - .4 * Math.sin(Math.PI * b), mouth: 'grin' };
    return { x: HX, y: TOP, armL: .5, armR: .5, mouth: 'smile', look: Math.sin(t * 3) * .5 };
  }
  if (t < FINAL + .5) {
    const up = eOut(prog(t, FINAL - 1.0, FINAL - .5));
    const jerk = t > FINAL ? Math.exp(-(t - FINAL) * 10) * .25 : 0;
    return { x: HX, y: TOP, armL: .55, armR: lerp(.5, 2.35, up) - jerk, mouth: 'grin', look: .2 };
  }
  const j = prog(t, FINAL + .5, FINAL + 1.1);
  return { x: HX, y: TOP - Math.sin(Math.PI * j) * 90, armL: 2.7, armR: 2.6 + .35 * Math.sin(t * 12), mouth: 'grin' };
}
sfx(0.6, 'whistle', 1.3); sfx(1.9, 'thud'); sfx(2.7, 'swish'); sfx(SNAP1, 'snap'); sfx(SNAP1 + .05, 'wrap');
sfx(6.35, 'boing', 300); sfx(FINAL - 10.5, 'whistle', .8); sfx(FINAL - 9.7, 'thud'); sfx(FINAL, 'snap'); sfx(FINAL + .02, 'sparkleBig');
let SNAP_PT, FINAL_PT;
{ const p = heroPose(SNAP1); SNAP_PT = handPos(HERO, p, 1); const q = heroPose(FINAL); FINAL_PT = handPos(HERO, q, 1); }

// ---------- gift wrap: ribbons, bows, tag ----------

window.__sfx = SFX.sort((a, b) => a[0] - b[0]);
window.__timing = { BPM, M0, V2, V3, TAGBEAT, FINAL, SNAP1, DURATION };
const font = new FontFace('Oswald', 'url(../countdown/fonts/Oswald-Bold.ttf)', { weight: '700' });
document.fonts.add(font);
window.__ready = font.load().catch(() => {});

// ---------- live mode ----------
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`;
}
if (!location.search.includes('capture')) {
  fit(); addEventListener('resize', fit);
  let t0 = null;
  const au = document.getElementById('au');
  addEventListener('click', () => { t0 = performance.now(); au.currentTime = 0; au.play().catch(() => {}); });
  const loop = now => { window.__render(t0 == null ? 0 : Math.min((now - t0) / 1000, DURATION)); requestAnimationFrame(loop); };
  window.__ready.then(() => requestAnimationFrame(loop));
} else {
  window.__ready.then(() => window.__render(0));
}
</script>
</body>
